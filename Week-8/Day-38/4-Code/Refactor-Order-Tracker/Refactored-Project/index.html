<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Tracker v2 -Refactored</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header with Stats -->
      <header>
        <h1>Order Tracker v2 -Refactored</h1>
        <div class="stats">
          <div class="stat-box">
            <div class="value" id="pending-count">0</div>
            <div class="label">Pending</div>
          </div>
          <div class="stat-box">
            <div class="value" id="completed-count">0</div>
            <div class="label">Completed</div>
          </div>
          <div class="stat-box">
            <div class="value" id="revenue">$0.00</div>
            <div class="label">Revenue</div>
          </div>
        </div>
      </header>

      <main>
        <!-- Add Order Form -->
        <section class="form-panel">
          <h2>Add New Order</h2>
          <form id="order-form">
            <div class="form-group">
              <label for="customer-name">Customer Name</label>
              <input
                type="text"
                id="customer-name"
                placeholder="Enter customer name"
                required
              />
            </div>
            <div class="form-group">
              <label for="order-items">Order Items</label>
              <input
                type="text"
                id="order-items"
                placeholder="e.g., Burger, Fries, Soda"
                required
              />
            </div>
            <div class="form-group">
              <label for="order-total">Order Total ($)</label>
              <input
                type="number"
                id="order-total"
                placeholder="e.g., 18.75"
                step="0.01"
                min="0.01"
                required
              />
            </div>
            <button type="submit" class="btn">Add Order</button>
          </form>
          <hr />
          <button class="btn" id="reset">Reset Orders</button>
        </section>

        <!-- Orders Display -->
        <section class="orders-panel">
          <div class="order-section pending">
            <h3>Pending Orders</h3>
            <div id="pending-orders">
              <!-- Pending orders will be displayed here -->
            </div>
          </div>
          <div class="order-section completed">
            <h3>Completed Orders</h3>
            <div id="completed-orders">
              <!-- Completed orders will be displayed here -->
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
